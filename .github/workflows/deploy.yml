name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/373426633543/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@cyberandlegal-lab.iam.gserviceaccount.com"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend
        run: |
          gcloud builds submit --tag europe-west4-docker.pkg.dev/cyberandlegal-lab/backend/api
          
          gcloud run deploy cyberandlegal-backend \
            --image europe-west4-docker.pkg.dev/cyberandlegal-lab/backend/api \
            --region europe-west4 \
            --platform managed \
            --allow-unauthenticated
